[platformio]
; Tell PIO to treat this folder (containing .ino) as the source directory
src_dir = .


[env:nano_r4]
platform = renesas-ra
board = nano_r4
framework = arduino
monitor_speed = 115200
lib_deps =
     https://github.com/thomasfredericks/Bounce2.git#v2.71
     https://github.com/thomasfredericks/MicroOsc.git
     https://github.com/SofaPirate/Chrono.git